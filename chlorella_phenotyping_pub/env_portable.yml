# Portable version of env.yml (any OS): only the packages the pub notebook needs,
# pinned to the versions used for the analysis, without platform-specific build strings.
# Exact Apple Silicon environment: env.yml
#
#   conda env create -f env_portable.yml
#   conda activate chlorella-pub
name: chlorella-pub
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.3.4
      - pandas==2.3.3
      - scipy==1.16.3
      - scikit-learn==1.7.2
      - scikit-image==0.25.2
      - statsmodels==0.14.5
      - zarr==3.1.3
      - matplotlib==3.10.6
      - seaborn==0.13.2
      - plotly==6.5.2
      - arcadia-pycolor==0.6.5
      - jupyterlab==4.4.7
      - ipykernel==6.31.0
